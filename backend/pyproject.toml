[project]
name = "ml-systems-portfolio-api"
version = "0.1.0"
description = "FastAPI backend for an ML/AI engineer portfolio."
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic==1.20.1",
  "aiosqlite==0.22.1",
  "asyncpg==0.32.0",
  "email-validator==2.3.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "sqlalchemy[asyncio]==2.1.6",
  "uvicorn[standard]==0.40.0"
]

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.22"
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
exclude = "migrations/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
